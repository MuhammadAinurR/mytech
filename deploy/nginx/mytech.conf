# Installed as /etc/nginx/sites-available/mytech (symlinked into sites-enabled).
# This is the file before certbot: `certbot --nginx -d startup.rofiq.id --redirect`
# adds the 443 listener, the certificate paths, and the http→https redirect.
server {
    server_name startup.rofiq.id;

    # Company logos go through a server action (Next's body limit is 1 MB).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: the app rate-limits logins and sign-ups by the
        # first X-Forwarded-For entry, so clients must not be able to supply it.
        # Revisit if a CDN or another proxy is ever put in front of nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Pages stream their body after the shell; don't hold it back.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
